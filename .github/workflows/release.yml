name: Release

on:
  push:
    branches:
      - master
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Verify GitHub Token is set
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "❌ GH_TOKEN secret is not set!"
            exit 1
          else
            echo "✅ GH_TOKEN is configured (length: ${#GH_TOKEN})"
            echo "Token value (will be masked by GitHub): $GH_TOKEN"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          # This creates a "Version Packages" PR that bumps versions
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
